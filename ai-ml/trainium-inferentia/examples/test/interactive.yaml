apiVersion: v1
kind: Pod
metadata:
  name: neuron-interactive
spec:
  hostNetwork: true
  nodeSelector:
    node.kubernetes.io/instance-type: trn1.32xlarge
  tolerations:
  - key: "aws.amazon.com/neuron"
    operator: "Exists"
  containers:
    - name: trn1
      command: ["/usr/bin/sleep"]
      args:  ["infinity"]
      image: 763104351884.dkr.ecr.us-west-2.amazonaws.com/pytorch-training-neuronx:1.13.1-neuronx-py310-sdk2.20.2-ubuntu20.04
      #763104351884.dkr.ecr.us-west-2.amazonaws.com/pytorch-training-neuronx:2.1.2-neuronx-py310-sdk2.20.2-ubuntu20.04
      resources:
        limits:
          aws.amazon.com/neuroncore: 32
          vpc.amazonaws.com/efa: 8
        requests:
          aws.amazon.com/neuroncore: 32
          vpc.amazonaws.com/efa: 8